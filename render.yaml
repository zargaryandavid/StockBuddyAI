# Render Blueprint for the StockBuddyAI API (apps/api). The web app runs on Vercel.
# In Render: New -> Blueprint -> pick this repository. Values marked `sync: false`
# are asked for once in the Render dashboard and are never stored in git.
services:
  - type: web
    name: stockbuddy-api
    runtime: python
    rootDir: apps/api
    # A paid instance stays awake; the free one sleeps after 15 minutes, which stops
    # reminder emails and makes the first request slow.
    plan: starter
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn stockbuddy.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # The Vercel address, so browsers on the site may call the API.
      - key: WEB_ORIGIN
        value: https://stock-buddy-ai.vercel.app
      - key: SUPABASE_URL
        value: https://lbzttvupzggeqhvtnzvv.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Also unlocks the keys saved in Admin -> Connections; use the same value as locally.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: ADMIN_LOGIN_EMAIL
        sync: false
      # AI keys can also be set later in Admin -> Connections.
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
